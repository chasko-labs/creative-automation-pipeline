version: 0.2

# repository-owned CodeBuild execution contract
# the project supplies role credentials and webhook branch metadata
# this file runs deterministic repository gates only, then selects the deploy target
# the deployment script enforces the same branch/target contract before mutation

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --quiet uv
      - pip install --quiet cfn-lint==1.51.5
      - npm ci
      - uv sync --frozen || uv sync

  build:
    commands:
      - echo "gate 1/10 ruff"
      - uvx ruff@0.15.12 check .

      - echo "gate 2/10 vitest"
      - npm run test:vitest

      - echo "gate 3/10 panda token parity"
      - python3 scripts/check-panda-tokens.py

      - echo "gate 4/10 data mirror parity"
      - python3 scripts/build-frontier-mapping.py --check

      - echo "gate 5/10 kodiak parity"
      - uv run --with pytest pytest -q tests/test_kodiak_parity.py tests/test_token_drift.py

      - echo "gate 6/10 python unit and integration tests"
      - uv run --with pytest pytest -x -q

      - echo "gate 7/10 deterministic accessibility check"
      - node scripts/check-spectrum.mjs

      - echo "gate 8/10 deterministic render check"
      - node scripts/check-brand-render.mjs

      - echo "gate 9/10 local browser scenarios"
      - npm run test:browser

      - echo "gate 10/10 infrastructure template lint"
      - cfn-lint infra/template.yaml

      - |
        set -eu
        branch_ref="${CODEBUILD_WEBHOOK_HEAD_REF:-}"
        case "$branch_ref" in
          refs/heads/*) branch="${branch_ref#refs/heads/}" ;;
          *) echo "CODEBUILD_WEBHOOK_HEAD_REF must be a refs/heads branch" >&2; exit 1 ;;
        esac
        if [ -z "$branch" ] || [ "$branch" = "HEAD" ]; then
          echo "CodeBuild webhook branch is empty or detached" >&2
          exit 1
        fi
        if [ "$branch" = "main" ]; then
          target=prod
        else
          target=dev
        fi
        echo "deploy target: $target for branch: $branch"
        ./scripts/deploy-frontier.sh "$target"

cache:
  paths:
    - /root/.cache/uv/**/*
    - .ruff_cache/**/*
