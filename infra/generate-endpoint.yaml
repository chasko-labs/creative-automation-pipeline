AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Kodiak creatives - standalone prompt-to-image generation endpoint stack
  (kodiak-creatives-generate). Container-image Lambda that runs Bedrock
  (Nova Pro art-direction + Stability control-structure and outpaint inference
  profiles) plus pillow, uploads the rendered PNG to the DAM S3
  bucket under brands/kodiak/renders/, and returns a presigned url. Fronted by a
  public (dev-open) Lambda Function URL that the site calls directly. The
  container image must be built and pushed to ECR BEFORE deploy - its uri is
  passed in via the ImageUri parameter. See the Metadata block for the exact
  build+push recipe.

Metadata:
  # ------------------------------------------------------------------------
  # WHY PackageType: Image (not Zip):
  #   the handler pulls in the creative_automation package + pillow + boto3,
  #   which exceeds the 250 MB unzipped Lambda zip limit. A container image
  #   (10 GB limit) is the supported path. The image is built + pushed to ECR
  #   first; CloudFormation only references it by uri (ImageUri parameter).
  #
  # CONTAINER BUILD RECIPE (run from repo root before deploying this stack):
  #
  #   Dockerfile (infra/generate.Dockerfile or repo root):
  #     FROM public.ecr.aws/lambda/python:3.11
  #     COPY pyproject.toml ./
  #     COPY src/ ./src/
  #     RUN pip install --no-cache-dir . pillow boto3
  #     CMD ["creative_automation.generate_lambda.handler"]
  #
  #   build + create ECR repo + push (account 946179428633, us-east-1):
  #     ACCOUNT=946179428633
  #     REGION=us-east-1
  #     REPO=kodiak-creatives-generate
  #     TAG=latest
  #     ECR=${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com
  #
  #     aws ecr describe-repositories --repository-names "$REPO" --region "$REGION" \
  #       || aws ecr create-repository --repository-name "$REPO" --region "$REGION"
  #
  #     aws ecr get-login-password --region "$REGION" \
  #       | docker login --username AWS --password-stdin "$ECR"
  #
  #     docker build -f infra/generate.Dockerfile -t "$REPO:$TAG" .
  #     docker tag "$REPO:$TAG" "$ECR/$REPO:$TAG"
  #     docker push "$ECR/$REPO:$TAG"
  #
  #   then deploy passing the pushed uri:
  #     --parameter-overrides ImageUri=${ECR}/${REPO}:${TAG}
  # ------------------------------------------------------------------------
  DocumentedManualStep: >-
    Build and push the container image to ECR repo kodiak-creatives-generate
    BEFORE deploying this stack, then pass its uri as the ImageUri parameter.
    See the build recipe comment above.

Parameters:
  ImageUri:
    Type: String
    Description: >-
      ECR image uri for the generation Lambda container (build+push the container
      first, e.g. 946179428633.dkr.ecr.us-east-1.amazonaws.com/kodiak-creatives-generate:latest).

Resources:
  # Tagging strategy (this stack = kodiak-creatives-generate):
  GenerateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: generate-lambda-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Nova Pro (Converse) art-directs the scene prompt + caption.
              - Sid: BedrockInvokeNovaPro
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0
              # Grounded-director embeddings (us-east-1): Nova multimodal primary,
              # Titan text fallback. Without these retrieve() fails closed to []
              # and every headline degrades to stock Nova even with the kill-switch on.
              - Sid: BedrockInvokeDirectorEmbeddings
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-2-multimodal-embeddings-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              # Grounded-director voice model: imported fine-tune in us-west-2
              # (own region on purpose — KODIAK_ARTDIRECTOR_REGION). Same failure
              # mode: without this grant art_direct_grounded returns mock source
              # and the headline falls back to stock Nova.
              - Sid: BedrockInvokeArtDirectorVoice
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: arn:aws:bedrock:us-west-2:946179428633:imported-model/cx15b77k5nge
              # Stability control-structure (1:1 real GenAI). us.* inference
              # profile invoke authorizes against BOTH the profile ARN AND every
              # foundation-model ARN the profile routes to (us-east-1/-2, us-west-2).
              - Sid: BedrockInvokeStabilityControlStructure
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1:946179428633:inference-profile/us.stability.stable-image-control-structure-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/stability.stable-image-control-structure-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/stability.stable-image-control-structure-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/stability.stable-image-control-structure-v1:0
              # Stability outpaint (true GenAI extend for 4:5 + 2:3). Same
              # inference-profile + foundation-model dual-grant requirement.
              - Sid: BedrockInvokeStabilityOutpaint
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1:946179428633:inference-profile/us.stability.stable-outpaint-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/stability.stable-outpaint-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/stability.stable-outpaint-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/stability.stable-outpaint-v1:0
              # Server-side localization (issue #201): _build_localizations calls
              # Amazon Translate for non-English rows after the Nova rewrite seam.
              # The role previously lacked this grant, so every Translate call
              # failed closed and ES/PT rows degraded silently to verbatim
              # English. Amazon Translate does not support resource-level
              # permissions — Resource "*" is required, scoped to the single
              # read-only TranslateText action.
              - Sid: TranslateTextForLocalization
                Effect: Allow
                Action: translate:TranslateText
                Resource: "*"
              - Sid: DamRendersReadWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: arn:aws:s3:::chasko-creative-dam-946179428633-us-east-1/brands/kodiak/renders/*
      Tags:
        - Key: project
          Value: kodiak-creatives
        - Key: team
          Value: platform
        - Key: managed-by
          Value: cloudformation
        - Key: repo
          Value: chasko-labs/creative-automation-pipeline
        - Key: environment
          Value: production
        - Key: stack
          Value: kodiak-creatives-generate

  GenerateLambda:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt GenerateLambdaRole.Arn
      # 300s (5 min) accommodates 4 serial Bedrock GenAI round-trips: Nova Pro
      # scene prompt + Stability control-structure restyle + 2x Stability
      # outpaint. The 60s ceiling killed the chain mid-outpaint. Lambda max is
      # 900; 300 gives headroom without being wasteful.
      Timeout: 300
      # 3008 MB (up from 2048) buys proportionally more vCPU, which speeds the
      # Pillow compositing and the boto3 TLS/serialization around each Bedrock
      # call. This is image work, not memory-bound compute - 3008 is the sane
      # cost/perf point, do not go higher.
      MemorySize: 3008
      Environment:
        Variables:
          DAM_S3_BUCKET: chasko-creative-dam-946179428633-us-east-1
          AWS_XRAY_SDK_ENABLED: "false"
      Tags:
        - Key: project
          Value: kodiak-creatives
        - Key: team
          Value: platform
        - Key: managed-by
          Value: cloudformation
        - Key: repo
          Value: chasko-labs/creative-automation-pipeline
        - Key: environment
          Value: production
        - Key: stack
          Value: kodiak-creatives-generate

  # AuthType NONE: public, dev-open. The site calls this url directly with no
  # signing. Tighten to AWS_IAM before any production/public exposure.
  GenerateFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt GenerateLambda.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        # OPTIONS is not a valid AllowMethods enum value - Lambda Function URLs
        # answer the CORS preflight (OPTIONS) automatically from this config, so
        # only the real invocation method (POST) is listed.
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type

  GenerateFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GenerateLambda
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint for prompt-to-image generation
    Value: !GetAtt GenerateFunctionUrl.FunctionUrl
  LambdaName:
    Description: Name of the generation Lambda function
    Value: !Ref GenerateLambda
  LambdaRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt GenerateLambdaRole.Arn
