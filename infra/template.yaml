AWSTemplateFormatVersion: "2010-09-09"
Description: Kodiak creative pipeline - one cloud setup for style library, localization memory, and retail network. Retains buckets on delete.
Parameters:
  ProjectName:
    Type: String
    Default: kodiak-creatives
  BucketName:
    Type: String
    Default: chasko-creative-dam-946179428633-us-east-1
    Description: Cloud storage bucket name - must be globally unique. Current live bucket is chasko-creative-dam-946179428633-us-east-1 in us-east-1. Change only if you need a second environment.

Resources:
  # Cloud storage for style and photos - versioned, private, encrypted
  StyleLibraryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: renders-archive
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
              - StorageClass: GLACIER
                TransitionInDays: 180
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
                NewerNoncurrentVersions: 2
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: brand
          Value: kodiak

  StyleLibraryBucketPolicyTLSOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StyleLibraryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub ${StyleLibraryBucket.Arn}
              - !Sub ${StyleLibraryBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # Table that remembers what worked per place - one row per creative per place
  LocalizationMemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-localization-memory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Retail network - every store that carries Kodiak, one row per storefront
  RetailNetworkTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-retail-network
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_id
          AttributeType: S
        - AttributeName: market
          AttributeType: S
      KeySchema:
        - AttributeName: store_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byMarket
          KeySchema:
            - AttributeName: market
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Searchable knowledge - place, audience, message, photo cue - via vector storage
  # Using S3 Vectors (managed, no servers) with S3VectorsConfiguration for the knowledge base
  # See docs at https://docs.aws.amazon.com/bedrock/latest/userguide/kb-permissions.html for full policy

  CreativePipelineLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true

  # Observability: structured app logs land here. cfn-lint 1.51.5 models
  # AWS::Logs::LogGroup Tags as a list of {Key,Value} (same shape as S3/DynamoDB),
  # NOT a key-value map - the map shape fails E3012.
  CreativePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /kodiak/creative-pipeline
      RetentionInDays: 30
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # X-Ray sampling rule - captures kodiak traces above the 5% Default rule.
  # Priority 9000 sits below Default (10000) so it is evaluated first.
  # ServiceName wildcard suffix matches kodiak-creative and any suffixed variant.
  KodiakSamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: kodiak-creative
        Priority: 9000
        ReservoirSize: 1
        FixedRate: 0.10
        ServiceName: "kodiak-creative*"
        ServiceType: "*"
        Host: "*"
        HTTPMethod: "*"
        URLPath: "*"
        ResourceARN: "*"
        Version: 1

  # Standalone managed policy for a future app runtime role (Lambda/ECS)
  # to attach. The runtime role is not defined in this template yet.
  ObservabilityWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege write access for kodiak structured logs + X-Ray traces
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteStructuredLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt CreativePipelineLogGroup.Arn
              - !Sub ${CreativePipelineLogGroup.Arn}:*
          # X-Ray write actions do not support resource-level scoping - AWS
          # requires Resource "*" for PutTraceSegments/PutTelemetryRecords.
          # The sampling reads (Get*) are used by the SDK sampler and also
          # only accept "*". This is an AWS service constraint, not a widening.
          - Sid: WriteTracesAndReadSampling
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:GetSamplingStatisticSummaries
            Resource: "*"

Outputs:
  StyleLibraryBucketName:
    Value: !Ref StyleLibraryBucket
    Description: Cloud storage bucket - use as DAM_S3_BUCKET with prefix brands/kodiak/
  StyleLibraryPrefix:
    Value: brands/kodiak/
  LocalizationMemoryTableName:
    Value: !Ref LocalizationMemoryTable
  RetailNetworkTableName:
    Value: !Ref RetailNetworkTable
  LogBucketName:
    Value: !Ref CreativePipelineLogBucket
  CreativePipelineLogGroupName:
    Value: !Ref CreativePipelineLogGroup
    Description: CloudWatch log group for structured app logs
  ObservabilityWritePolicyArn:
    Value: !Ref ObservabilityWritePolicy
    Description: Managed policy arn a future app runtime role attaches for logs + X-Ray writes
  NextSteps:
    Value: !Sub "export DAM_S3_BUCKET=${StyleLibraryBucket} DAM_S3_PREFIX=brands/kodiak/ && ./scripts/sync-dam.sh push"
