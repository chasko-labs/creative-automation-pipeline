AWSTemplateFormatVersion: "2010-09-09"
Description: Kodiak creative pipeline - one cloud setup for style library, localization memory, and retail network. Retains buckets on delete.
Parameters:
  ProjectName:
    Type: String
    Default: kodiak-creatives
  BucketName:
    Type: String
    Default: chasko-creative-dam-946179428633-us-east-1
    Description: Cloud storage bucket name - must be globally unique. Current live bucket is chasko-creative-dam-946179428633-us-east-1 in us-east-1. Change only if you need a second environment.

Resources:
  # Cloud storage for style and photos - versioned, private, encrypted
  StyleLibraryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: renders-archive
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
              - StorageClass: GLACIER
                TransitionInDays: 180
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
                NewerNoncurrentVersions: 2
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: brand
          Value: kodiak

  StyleLibraryBucketPolicyTLSOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StyleLibraryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub ${StyleLibraryBucket.Arn}
              - !Sub ${StyleLibraryBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # Table that remembers what worked per place - one row per creative per place
  LocalizationMemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-localization-memory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: market
          AttributeType: S
        - AttributeName: place_message_id
          AttributeType: S
      KeySchema:
        - AttributeName: market
          KeyType: HASH
        - AttributeName: place_message_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Retail network - every store that carries Kodiak, one row per storefront
  RetailNetworkTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-retail-network
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_id
          AttributeType: S
        - AttributeName: market
          AttributeType: S
      KeySchema:
        - AttributeName: store_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byMarket
          KeySchema:
            - AttributeName: market
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Searchable knowledge - place, audience, message, photo cue - via vector storage
  # Using S3 Vectors (managed, no servers) with S3VectorsConfiguration for the knowledge base
  # See docs at https://docs.aws.amazon.com/bedrock/latest/userguide/kb-permissions.html for full policy

  CreativePipelineLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true

  # CI service role - least privilege. The per-push gate is ruff + pytest + cfn-lint,
  # none of which make aws api calls (cfn-lint runs offline). So the only grant this
  # role needs is CloudWatch Logs to its own log group. No S3 / DynamoDB / Bedrock / SSM.
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ci-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/codebuild/${ProjectName}-ci
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/codebuild/${ProjectName}-ci:*
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Fast per-push CI gate. Webhook fires on push and on PR create/update/reopen.
  # RUN_SLOW pinned false here so the slow path (render/nova-act/embedding) never
  # runs on the per-push gate - it belongs to nightly/manual runs only.
  CreativePipelineCI:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-ci
      Description: !Sub Fast per-push CI gate for ${ProjectName} - ruff, pytest, cfn-lint
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: GITHUB
        Location: https://github.com/chasko-labs/creative-automation-pipeline.git
        BuildSpec: buildspec.yml
        ReportBuildStatus: true
        GitCloneDepth: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: RUN_SLOW
            Value: "false"
            Type: PLAINTEXT
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
          - - Type: EVENT
              Pattern: PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED,PULL_REQUEST_REOPENED
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /codebuild/${ProjectName}-ci
      Tags:
        - Key: project
          Value: !Ref ProjectName

Outputs:
  StyleLibraryBucketName:
    Value: !Ref StyleLibraryBucket
    Description: Cloud storage bucket - use as DAM_S3_BUCKET with prefix brands/kodiak/
  StyleLibraryPrefix:
    Value: brands/kodiak/
  LocalizationMemoryTableName:
    Value: !Ref LocalizationMemoryTable
  RetailNetworkTableName:
    Value: !Ref RetailNetworkTable
  LogBucketName:
    Value: !Ref CreativePipelineLogBucket
  CodeBuildProjectName:
    Value: !Ref CreativePipelineCI
    Description: Per-push CI gate project name
  CodeBuildServiceRoleArn:
    Value: !GetAtt CodeBuildServiceRole.Arn
    Description: Least-privilege CodeBuild service role arn (CloudWatch Logs only)
  NextSteps:
    Value: !Sub "export DAM_S3_BUCKET=${StyleLibraryBucket} DAM_S3_PREFIX=brands/kodiak/ && ./scripts/sync-dam.sh push"
