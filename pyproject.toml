[project]
name = "creative-automation-pipeline"
version = "0.1.0"
description = "Kodiak Cakes — real food for real adventures. Frontier creative system that turns one Kodiak brief into hundreds of local ads (Bear Brown #3B2316, Wasatch, Keep It Wild)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "boto3>=1.34",
  "botocore>=1.34",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "jinja2>=3.0",
]

[project.optional-dependencies]
rust = ["maturin>=1.5"]
# analysis: offline clustering of the Nova image vectors (scripts/cluster-image-standards.py).
# numpy only — spherical k-means is hand-rolled so no scikit-learn dependency is pulled in.
analysis = ["numpy>=1.26"]
# observability: AWS X-Ray tracing. OPTIONAL — the Observer autodetects absence and no-ops,
# so CI + offline dev stay green without it. structured JSON logging works with no extra.
observability = ["aws-xray-sdk>=2.12"]

[project.scripts]
creative-auto = "creative_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/kodiak-local/Cargo.toml"
module-name = "creative_automation._kodiak_local"

