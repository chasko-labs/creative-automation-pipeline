[project]
name = "creative-automation-pipeline"
version = "0.1.0"
description = "Kodiak Cakes — real food for real adventures. Frontier creative system that turns one Kodiak brief into hundreds of local ads (Bear Brown #3B2316, Wasatch, Keep It Wild)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "jinja2>=3.0",
]

[project.scripts]
creative-auto = "creative_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
